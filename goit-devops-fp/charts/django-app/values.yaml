replicaCount: 1

image:
  repository: 794531974301.dkr.ecr.eu-central-1.amazonaws.com/final-project-repo
  pullPolicy: Always
  tag: "latest"

service:
  type: LoadBalancer
  port: 8000

ingress:
  enabled: false

resources: 
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  DJANGO_ENV: "production"
  DJANGO_ALLOWED_HOSTS: "*"
  DEBUG: "False"
